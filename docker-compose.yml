services:
  analyst:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_PATH: /app/data/esg.db
      TOP_K: ${TOP_K:-6}
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
