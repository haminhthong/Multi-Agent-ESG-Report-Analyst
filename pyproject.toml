[project]
name = "multi-agent-esg-report-analyst"
version = "0.1.0"
description = "Evidence-grounded multi-agent ESG report analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
esg-analyst = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["B008"]
