[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-report-analyst"
version = "0.1.0"
description = "Evidence-grounded ESG report analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "pypdf>=5,<7",
    "PyYAML>=6,<7",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.13,<1",
    "Pillow>=10,<13",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
ml = ["sentence-transformers>=3,<6"]


[project.scripts]
esg-analyst = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-q", "--basetemp=.pytest_tmp"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.data-files]
rubrics = ["rubrics/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008", "EXE002"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
