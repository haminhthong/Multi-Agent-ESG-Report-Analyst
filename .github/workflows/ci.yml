name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check app tests scripts

      - name: Lint
        run: ruff check app tests scripts

      - name: Unit and integration tests
        run: pytest -q

      - name: Canonical pipeline import smoke test
        run: python -c "from app.pipeline import ESGPipeline; from app.main import app; print(app.title, ESGPipeline.__name__)"

      - name: Retrieval quality gate
        run: >-
          python -m app.cli --database data/ci-eval.db evaluate
          --mode bm25 --min-recall 0.8 --min-mrr 0.8

      - name: Docker build
        run: docker build -t esg-report-analyst:${{ github.sha }} .
